services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_DAILY_CALL_BUDGET: ${GEMINI_DAILY_CALL_BUDGET:-18}
    volumes:
      - ./backend/data:/app/data
      - ./backend/landing:/app/landing
      - ./backend/generated_etl:/app/generated_etl
